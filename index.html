<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Vận hành hệ thống mạng</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout: nav + tab bar + variable bar, rồi các row gập được của lưới panel 24 cột */
:root{
  --bg:#111217; --panel:#181b1f; --hdr:#1f2227; --border:#2c3235; --border2:#3d444d;
  --ink:#d8d9df; --ink2:#9b9ba6; --ink3:#6e7079; --accent:#ff780a; --accent-ink:#ffd4ad;
  --s1:#ff9830; --s2:#5794f2; --s3:#73bf69; --s4:#d9b4f2; --s5:#f2cc0c; --s6:#f2495c; --s7:#52c8e8;
  --ok:#73bf69; --warn:#f2cc0c; --serious:#ff9830; --crit:#f2495c; --off:#5c6066;
  --grid:rgba(216,217,223,.07); --hov:#20242a; --inset:#0f1013; --shadow:rgba(0,0,0,.55);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f4f5f5; --panel:#ffffff; --hdr:#ffffff; --border:#dde0e4; --border2:#c7d0d9;
  --ink:#24292e; --ink2:#51565c; --ink3:#7b8087; --accent:#e0752d; --accent-ink:#8a3b00;
  --s1:#e0752d; --s2:#1f60c4; --s3:#37872d; --s4:#8f3bb8; --s5:#e0b400; --s6:#c4162a; --s7:#0a76a0;
  --ok:#1a7f37; --warn:#b58a00; --serious:#c05621; --crit:#c4162a; --off:#9aa0a6;
  --grid:rgba(36,41,46,.09); --hov:#f4f5f5; --inset:#f0f1f3; --shadow:rgba(24,26,30,.18);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f4f5f5; --panel:#ffffff; --hdr:#ffffff; --border:#dde0e4; --border2:#c7d0d9;
  --ink:#24292e; --ink2:#51565c; --ink3:#7b8087; --accent:#e0752d; --accent-ink:#8a3b00;
  --s1:#e0752d; --s2:#1f60c4; --s3:#37872d; --s4:#8f3bb8; --s5:#e0b400; --s6:#c4162a; --s7:#0a76a0;
  --ok:#1a7f37; --warn:#b58a00; --serious:#c05621; --crit:#c4162a; --off:#9aa0a6;
  --grid:rgba(36,41,46,.09); --hov:#f4f5f5; --inset:#f0f1f3; --shadow:rgba(24,26,30,.18);
  color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hdr);z-index:40}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
button,summary,input{font:inherit;color:inherit}button,summary{cursor:pointer}
summary::-webkit-details-marker{display:none}summary{list-style:none}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
pre{margin:0;font-family:var(--mono);font-size:11px;white-space:pre-wrap;word-break:break-word}

/* ---------- nav ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--hdr);border-bottom:1px solid var(--border)}
.nav-in{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{width:22px;height:22px;flex:none;border-radius:50%;background:conic-gradient(from 200deg,var(--accent),#f2cc0c 62%,var(--accent))}
.crumb{display:flex;align-items:center;gap:7px;min-width:0}
.crumb span{color:var(--ink3)}
.crumb b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tagrow{display:flex;gap:4px}
.tag{background:var(--inset);border:1px solid var(--border);border-radius:10px;padding:0 7px;font-size:10.5px;color:var(--ink3)}
.spacer{flex:1 1 30px}
.ctl{display:flex;align-items:center;gap:6px;background:var(--inset);border:1px solid var(--border);
  border-radius:3px;padding:4px 9px;color:var(--ink2);white-space:nowrap;font-size:12px}
.ctl:hover{border-color:var(--border2);color:var(--ink)}
.ctl.on{border-color:var(--accent);color:var(--accent-ink)}
.ctl.ico{padding:4px 7px}
.live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
.dd{position:relative}
.dd .menu{position:absolute;right:0;top:calc(100% + 5px);min-width:176px;background:var(--hdr);
  border:1px solid var(--border2);border-radius:3px;box-shadow:0 8px 24px var(--shadow);padding:4px;z-index:35}
.dd[open] .ctl{border-color:var(--accent)}
.menu button{display:flex;width:100%;align-items:center;gap:8px;background:none;border:0;border-radius:2px;
  padding:5px 8px;font-size:12px;color:var(--ink2);text-align:left}
.menu button:hover{background:var(--hov);color:var(--ink)}
.menu button.sel{color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.menu .sep{height:1px;background:var(--border);margin:4px 2px}
.menu .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);padding:5px 8px 2px}
.menu .kbd{margin-left:auto;color:var(--ink3);font-family:var(--mono);font-size:10px}
.tabs{display:flex;gap:2px;overflow-x:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:7px 12px;color:var(--ink2);font-size:12.5px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tab .cnt{color:var(--ink3);font-size:11px}
.tab .dotal{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--crit);margin-left:2px;vertical-align:1px}

/* ---------- variable bar ---------- */
.vars{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:var(--bg);border-bottom:1px solid var(--border);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.var{display:flex;align-items:center}
.var>.k{background:var(--hdr);border:1px solid var(--border);border-right:0;border-radius:3px 0 0 3px;padding:3px 8px;color:var(--ink2);font-size:12px;white-space:nowrap}
.var .box{background:var(--inset);border:1px solid var(--border);border-radius:0 3px 3px 0;padding:3px 8px;font-size:12px;display:flex;gap:4px;align-items:center}
.chip{background:none;border:1px solid var(--border2);border-radius:2px;padding:1px 7px;font-size:11.5px;color:var(--ink3)}
.chip.on{border-color:var(--accent);color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.srch{background:var(--inset);border:1px solid var(--border);border-radius:3px;padding:3px 8px;font-size:12px;width:150px;min-width:0}

/* ---------- grid + panel ---------- */
.dash{padding-block:0 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rowhdr{display:flex;align-items:center;gap:8px;background:none;border:0;width:100%;text-align:left;
  padding:9px 2px 7px;color:var(--ink);font-size:12.5px;font-weight:600}
.rowhdr .ar{color:var(--ink3);transition:transform .15s;display:inline-block}
.rowhdr[aria-expanded="false"] .ar{transform:rotate(-90deg)}
.rowhdr .meta{color:var(--ink3);font-weight:400;font-size:11.5px}
.rowhdr:hover{color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:repeat(24,1fr);gap:8px;padding-bottom:4px}
.panel{grid-column:span var(--w,24);background:var(--panel);border:1px solid var(--border);border-radius:3px;
  display:flex;flex-direction:column;min-width:0;position:relative}
.panel>header{display:flex;align-items:baseline;gap:7px;padding:7px 10px 2px;min-width:0}
.panel>header h2{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel>header .sub{color:var(--ink3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel>header .info{color:var(--ink3);font-size:10.5px;border:1px solid var(--border2);border-radius:50%;
  width:13px;height:13px;display:inline-flex;align-items:center;justify-content:center;flex:none;cursor:help}
.pmenu{margin-left:auto;position:relative}
.pmenu>summary{color:var(--ink3);padding:0 3px;letter-spacing:1px;opacity:.5;font-size:13px}
.panel:hover .pmenu>summary,.pmenu[open]>summary{opacity:1}
.pmenu .menu{min-width:188px}
.body{padding:3px 10px 10px;flex:1;min-width:0;display:flex;flex-direction:column}
.panel.expanded{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:45;box-shadow:0 20px 60px var(--shadow)}
.panel.expanded .plot{height:100%!important;flex:1}
.panel.expanded .body{overflow:auto}
.backdrop{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,#000);z-index:44;display:none}
.backdrop.on{display:block}
body.kiosk .nav,body.kiosk .vars,body.kiosk footer{display:none}

/* ---------- stat ---------- */
.stat{position:relative;overflow:hidden;min-height:88px;justify-content:center}
.stat .v{font-size:clamp(22px,2.3vw,32px);font-weight:600;letter-spacing:-.02em;line-height:1.08}
.stat .u{font-size:.5em;font-weight:500;color:var(--ink2);margin-left:3px}
.stat .d{font-size:11.5px;color:var(--ink2);margin-top:3px}
.stat .d i{font-style:normal;font-weight:600}
.stat canvas{position:absolute;left:0;right:0;bottom:0;width:100%;height:42px;opacity:.45;pointer-events:none}
.up{color:var(--ok)}.down{color:var(--crit)}.flat{color:var(--ink3)}

/* ---------- plot ---------- */
.plot{position:relative;width:100%;height:210px;min-width:0}
.plot.sm{height:150px}.plot.xs{height:118px}.plot.lg{height:262px}
.plot canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tip{position:absolute;z-index:9;pointer-events:none;opacity:0;transition:opacity .08s;background:var(--hdr);
  border:1px solid var(--border2);border-radius:3px;padding:7px 9px;font-size:11.5px;box-shadow:0 6px 18px var(--shadow);min-width:150px}
.tip.on{opacity:1}
.tip .t{color:var(--ink3);margin-bottom:5px;font-family:var(--mono);font-size:10.5px}
.tip .r{display:flex;align-items:center;gap:9px;justify-content:space-between}
.tip .r em{font-style:normal;color:var(--ink2);display:flex;align-items:center;gap:6px}
.tip .r b{font-weight:500}
.sw{width:9px;height:3px;border-radius:2px;flex:none}
.sw.sq{width:9px;height:9px;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:3px 14px;padding-top:7px}
.legend .it{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink2)}
.legend .it b{color:var(--ink);font-weight:500;min-width:46px;text-align:right}
.legend .it.off{opacity:.4}

/* ---------- gauge / bar ---------- */
.gauges{display:grid;grid-template-columns:repeat(var(--gc,4),1fr);gap:4px}
.g{text-align:center;min-width:0}
.g svg{width:100%;max-width:126px;height:auto;display:block;margin:0 auto}
.g .nm{font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;flex-direction:column;gap:6px;padding-top:2px}
.bar{display:grid;grid-template-columns:84px 1fr 52px;align-items:center;gap:8px;font-size:11.5px}
.bar .nm{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:11px}
.bar .tr{height:13px;background:var(--inset);border-radius:2px;overflow:hidden;min-width:0}
.bar .fl{height:100%;border-radius:0 2px 2px 0;transition:width .4s ease}
.bar .vl{text-align:right;font-weight:500}

/* ---------- SLO ---------- */
.slo{display:flex;flex-direction:column;gap:9px;padding-top:2px}
.slorow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline}
.slorow .nm{font-size:11.5px;color:var(--ink2)}
.slorow .vv{font-weight:600;font-size:14px}
.slotr{grid-column:1/-1;height:8px;background:var(--inset);border-radius:2px;overflow:hidden;display:flex}
.slotr i{height:100%}
.slomt{grid-column:1/-1;font-size:10.5px;color:var(--ink3);font-family:var(--mono)}

/* ---------- table ---------- */
.scroll{overflow:auto;max-height:260px;min-width:0}
table.t{width:100%;border-collapse:collapse;font-size:11.5px}
table.t.wide{min-width:680px}
table.t th{position:sticky;top:0;background:var(--panel);text-align:left;color:var(--ink2);font-weight:500;
  padding:5px 8px;border-bottom:1px solid var(--border2);white-space:nowrap;z-index:1}
table.t.sortable th{cursor:pointer}
table.t.sortable th:hover{color:var(--ink)}
table.t th .ar{color:var(--ink3);font-size:9px}
table.t td{padding:4px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
table.t tbody tr:hover td{background:var(--hov)}
table.t td.r,table.t th.r{text-align:right}
table.t td.w{white-space:normal;min-width:180px}
table.t canvas{display:block;width:64px;height:18px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:2px;padding:1px 7px;font-size:10.5px;font-weight:500}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.crit{color:var(--crit);background:color-mix(in srgb,var(--crit) 15%,transparent)}
.pill.off{color:var(--ink3);background:color-mix(in srgb,var(--ink3) 15%,transparent)}
.pill.flat{color:var(--ink3);background:none;border:1px solid var(--border2)}
.lab{display:inline-block;background:var(--inset);border:1px solid var(--border);border-radius:2px;
  padding:0 5px;margin-right:3px;font-family:var(--mono);font-size:10px;color:var(--ink2)}
.empty{color:var(--ink3);font-size:11.5px;padding:14px 2px;text-align:center}

/* ---------- logs / alerts ---------- */
.logbar{display:flex;gap:4px;padding-bottom:5px;flex-wrap:wrap;align-items:center}
.logs{font-family:var(--mono);font-size:11px;line-height:1.6;overflow-y:auto;max-height:218px;flex:1}
.logs .ln{display:flex;gap:8px;padding:1px 0;border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent);white-space:pre-wrap;word-break:break-word}
.logs .ts{color:var(--ink3);flex:none}
.logs .lv{flex:none;font-weight:500}
.lv.INFO{color:var(--s2)}.lv.WARN{color:var(--warn)}.lv.ERROR{color:var(--crit)}.lv.DEBUG{color:var(--ink3)}
.logs .ms{color:var(--ink2);min-width:0}
.alerts{display:flex;flex-direction:column;gap:6px;overflow-y:auto;max-height:244px}
.al{display:flex;gap:9px;background:var(--inset);border:1px solid var(--border);border-left:3px solid var(--crit);border-radius:2px;padding:7px 9px}
.al.warn{border-left-color:var(--warn)}.al.serious{border-left-color:var(--serious)}
.al .ic{font-size:13px;line-height:1.25}
.al .tx{min-width:0;flex:1}
.al .tt{font-weight:500;font-size:12px}
.al .mt{color:var(--ink3);font-size:11px;font-family:var(--mono);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al .st{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;flex:none}

/* ---------- svg ---------- */
.svgwrap{overflow-x:auto}
.svgwrap svg{width:100%;height:auto;display:block}
.svgwrap.flow svg{min-width:620px}
.svgwrap.plan svg{min-width:460px}

/* ---------- modal ---------- */
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100vw - 32px));
  max-height:min(600px,calc(100vh - 64px));background:var(--panel);border:1px solid var(--border2);border-radius:4px;
  box-shadow:0 24px 70px var(--shadow);z-index:46;display:flex;flex-direction:column}
.modal header{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)}
.modal header h3{font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtabs{display:flex;gap:2px;padding:6px 12px 0;border-bottom:1px solid var(--border)}
.mtab{background:none;border:0;border-bottom:2px solid transparent;padding:5px 10px;color:var(--ink2);font-size:12px}
.mtab.on{color:var(--ink);border-bottom-color:var(--accent)}
.mbody{overflow:auto;padding:10px 12px;flex:1}
.qblock{background:var(--inset);border:1px solid var(--border);border-radius:3px;padding:9px 10px;margin-bottom:10px}
.qblock .qh{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-bottom:5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:11.5px}
.kv dt{color:var(--ink3)}.kv dd{margin:0;font-family:var(--mono);font-size:11px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12px;align-items:center}
.keys kbd{background:var(--inset);border:1px solid var(--border2);border-bottom-width:2px;border-radius:3px;
  padding:1px 6px;font-family:var(--mono);font-size:11px;color:var(--ink)}
footer{color:var(--ink3);font-size:11px;padding-block:0 24px;display:flex;gap:14px;flex-wrap:wrap;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
footer b{color:var(--ink2);font-weight:500}

@media (max-width:1080px){
  .panel{grid-column:span 12}
  .panel[data-w="16"],.panel[data-w="18"],.panel[data-w="20"],.panel[data-w="24"]{grid-column:span 24}
}
@media (max-width:620px){
  .panel{grid-column:span 24!important}
  .gauges{--gc:2}
  .bar{grid-template-columns:70px 1fr 46px}
  .srch{width:108px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<nav class="nav">
  <div class="nav-in">
    <div class="logo" aria-hidden="true"></div>
    <div class="crumb"><span>Dashboards</span><span>/</span><span>Hạ tầng mạng</span><span>/</span><b>Network Operations Center</b></div>
    <div class="tagrow"><span class="tag">network</span><span class="tag">noc</span><span class="tag">gnmi</span><span class="tag">snmp</span><span class="tag">prod</span></div>
    <div class="spacer"></div>
    <details class="dd" id="ddRange"><summary class="ctl">🕘 <span id="rangeLbl">Last 1 hour</span> ▾</summary><div class="menu" id="menuRange"></div></details>
    <button class="ctl ico" id="btnZoom" title="Zoom out khoảng thời gian (phím z)">🔍−</button>
    <details class="dd" id="ddRef"><summary class="ctl"><span class="live" id="liveDot"></span><span id="refLbl">2s</span> ▾</summary><div class="menu" id="menuRef"></div></details>
    <button class="ctl" id="btnTheme" title="Đổi giao diện">◐ <span id="themeLbl">Tối</span></button>
    <button class="ctl ico" id="btnJson" title="JSON model của dashboard">{ }</button>
    <button class="ctl ico" id="btnHelp" title="Phím tắt (?)">?</button>
    <button class="ctl ico" id="btnKiosk" title="Kiosk — phím k, Esc để thoát">⛶</button>
  </div>
  <div class="tabs" id="tabs"></div>
</nav>
<div class="vars" id="vars"></div>
<main class="dash" id="dash"></main>
<div class="backdrop" id="backdrop"></div>
<footer id="foot"></footer>

<script>
/* ===================== 1. NỀN: PRNG, THỜI GIAN ===================== */
let seed=20261112;
const rnd=()=>((seed=(seed*1103515245+12345)&0x7fffffff)/0x7fffffff);
const randn=()=>{let s=0;for(let i=0;i<6;i++)s+=rnd();return (s-3)/1.2247;};
const STEP=5000, N=1441;
let times=[];{const t0=Date.now()-(N-1)*STEP;for(let i=0;i<N;i++)times.push(t0+i*STEP);}
const RANGES=[{lbl:'Last 5 minutes',n:61},{lbl:'Last 15 minutes',n:181},{lbl:'Last 1 hour',n:721},{lbl:'Last 2 hours',n:1441}];
const REFS=[{lbl:'1s',ms:1000},{lbl:'2s',ms:2000},{lbl:'5s',ms:5000},{lbl:'10s',ms:10000},{lbl:'Off',ms:0}];

class Sensor{
  constructor(o){this.o=o;this.w=0;this.d=[];}
  step(k){const o=this.o;
    this.w+=-0.09*this.w+randn()*o.noise;
    if(o.spikeP&&rnd()<o.spikeP)this.w+=o.spikeMag*(rnd()>.5?1:.6);
    let v=o.base+(o.amp||0)*Math.sin(k*STEP/1000/(o.period||1800)*6.2832+(o.phase||0))+this.w;
    if(o.min!=null)v=Math.max(o.min,v); if(o.max!=null)v=Math.min(o.max,v);
    this.d.push(v); if(this.d.length>N)this.d.shift(); return v;}
  last(){return this.d[this.d.length-1];}
  at(i){return this.d[i];}
  avg(n){const a=this.d.slice(-n);return a.reduce((x,y)=>x+y,0)/a.length;}
  frac(n,f){const a=this.d.slice(-n);return a.filter(f).length/a.length;}
}

function fire(key,now){
  const r=RULES.find(x=>x.id===key.split(':')[0]);
  const a=ALERTS.get(key);
  if(a)return false;
  ALERTS.set(key,{key,rule:r,sev:r.sev,since:now,detail:''});
  ANN.push({t:now,sev:r.sev,text:r.id});if(ANN.length>60)ANN.shift();
  log(r.sev==='crit'?'ERROR':'WARN','[PENDING] '+r.id+' · '+r.expr,now);
  return true;
}
function resolve(key,now){
  const a=ALERTS.get(key);if(!a)return;
  ALERTS.delete(key);
  const d=now-a.since;
  log('INFO','[RESOLVED] '+a.rule.id+' sau '+dur(d),now);
  if(d>60000)INCIDENTS.unshift({id:'INC-'+(1043+INCIDENTS.length),rule:a.rule.id,sev:a.sev,
    start:a.since,mttr:Math.round(d/60000),cause:'Tự xử lý trong phiên mô phỏng',team:a.rule.labels.team,state:'resolved'});
}
function evalAlerts(now){
  RULES.forEach(r=>{const res=r.test();
    if(res){const key=r.id;if(!ALERTS.has(key))fire(key,now);const a=ALERTS.get(key);a.detail=res;a.last=now;}
    else resolve(r.id,now);});
}

function ticks(lo,hi,n){const span=hi-lo||1,raw=span/n,mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const st=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw)||mag*10;
  const out=[];for(let v=Math.ceil(lo/st)*st;v<=hi+1e-9;v+=st)out.push(+v.toFixed(10));return out.length?out:[lo,hi];}
function swStyle(c,dash){c=col(c);
  if(!dash||!dash.length)return 'background:'+c;
  if(dash.length===2)return 'background:repeating-linear-gradient(90deg,'+c+' 0 '+dash[0]+'px,transparent '+dash[0]+'px '+(dash[0]+dash[1])+'px)';
  return 'background:repeating-linear-gradient(90deg,'+c+' 0 7px,transparent 7px 10px,'+c+' 10px 12px,transparent 12px 15px)';}
let HOV={t:null,src:null,y:0};

/* ===================== 7. TIME SERIES ===================== */
function TS(host,cfg){
  const canvas=host.querySelector('canvas'), tip=host.querySelector('.tip');
  const inst={cfg,hide:new Set(),render(){draw();},
    data(){const n=WIN(),base=N-n,rows=[],ser=cfg.series.filter(zOK);
      for(let i=n-1;i>=Math.max(0,n-100);i--){const r=[hhs(times[base+i])];
        ser.forEach(s=>r.push(fx(s.d()[base+i],cfg.dec==null?1:cfg.dec)));rows.push(r);}
      return{cols:['Thời gian',...ser.map(s=>s.nm)],rows};}};
  function draw(){
    const g=cv(canvas);if(!g)return;const{c,W,H}=g;
    const n=WIN(),base=N-n,PL=44,PR=10,PT=8,PB=20,w=W-PL-PR,h=H-PT-PB;
    if(w<30||h<24)return;
    const vis=cfg.series.filter(s=>!inst.hide.has(s.nm)&&zOK(s));
    let lo=1e15,hi=-1e15;
    if(cfg.stack){for(let i=base;i<N;i++){let s=0;vis.forEach(sr=>s+=sr.d()[i]);if(s>hi)hi=s;if(s<lo)lo=s;}lo=0;}
    else vis.forEach(s=>{const d=s.d();for(let i=base;i<N;i++){if(d[i]<lo)lo=d[i];if(d[i]>hi)hi=d[i];}});
    if(!vis.length){lo=0;hi=1;}
    (cfg.thresholds||[]).forEach(t=>{if(t.v>hi)hi=t.v*1.02;});
    const pad=(hi-lo)*.16||1;lo=(cfg.zero||cfg.stack)?0:lo-pad;hi=hi+pad;
    if(cfg.yMax!=null)hi=cfg.yMax;if(cfg.yMin!=null)lo=cfg.yMin;
    const X=i=>PL+w*i/Math.max(1,n-1), Y=v=>PT+h-h*(v-lo)/(hi-lo||1);
    const dec=cfg.dec!=null?cfg.dec:((hi-lo)<12?1:0);
    (cfg.thresholds||[]).forEach(t=>{if(t.v<hi){const y=Math.max(PT,Y(hi));
      c.fillStyle=hexA(sevCol[t.sev],.10);c.fillRect(PL,y,w,Math.min(h,Y(t.v)-y));}});
    c.textBaseline='middle';
    ticks(lo,hi,4).forEach(v=>{const y=Y(v);if(y<PT-1||y>PT+h+1)return;
      c.strokeStyle=TH['--grid'];c.lineWidth=1;c.beginPath();c.moveTo(PL,Math.round(y)+.5);c.lineTo(PL+w,Math.round(y)+.5);c.stroke();
      c.fillStyle=TH['--ink3'];c.textAlign='right';c.fillText(Math.abs(v)>=1000?grp(v):fx(v,dec),PL-7,y);});
    c.textBaseline='top';c.textAlign='center';
    const stp=Math.max(1,Math.round((n-1)/5));
    for(let i=0;i<n;i+=stp){c.fillStyle=TH['--ink3'];c.fillText(hh(times[base+i]),X(i),PT+h+5);}
    (cfg.thresholds||[]).forEach(t=>{if(t.v>=lo&&t.v<=hi){c.strokeStyle=hexA(sevCol[t.sev],.75);c.lineWidth=1;c.setLineDash([5,4]);
      c.beginPath();c.moveTo(PL,Y(t.v)+.5);c.lineTo(PL+w,Y(t.v)+.5);c.stroke();c.setLineDash([]);}});
    if(cfg.ann)ANN.forEach(a=>{const ix=Math.round((a.t-times[base])/STEP);if(ix<0||ix>n-1)return;
      const x=Math.round(X(ix))+.5;c.strokeStyle=hexA(sevCol[a.sev],.8);c.lineWidth=1;c.setLineDash([3,3]);
      c.beginPath();c.moveTo(x,PT);c.lineTo(x,PT+h);c.stroke();c.setLineDash([]);
      c.fillStyle=col(sevCol[a.sev]);c.beginPath();c.moveTo(x-4,PT+h);c.lineTo(x+4,PT+h);c.lineTo(x,PT+h-5);c.closePath();c.fill();});
    const acc=cfg.stack?new Float64Array(n):null;
    vis.forEach(s=>{const d=s.d(),cc=col(s.tok),pts=[];
      for(let i=0;i<n;i++){let v=d[base+i];if(cfg.stack){acc[i]+=v;v=acc[i];}pts.push([X(i),Y(v)]);}
      if(cfg.area||cfg.stack){const gr=c.createLinearGradient(0,PT,0,PT+h);
        gr.addColorStop(0,hexA(s.tok,cfg.stack?.55:.42));gr.addColorStop(1,hexA(s.tok,.02));
        c.beginPath();c.moveTo(pts[0][0],PT+h);pts.forEach(p=>c.lineTo(p[0],p[1]));c.lineTo(pts[n-1][0],PT+h);c.closePath();c.fillStyle=gr;c.fill();}
      c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));
      c.strokeStyle=cc;c.lineWidth=cfg.thin?1.4:2;c.lineJoin='round';
      c.setLineDash(s.dash&&s.dash.length?s.dash:[]);c.stroke();c.setLineDash([]);
      const lp=pts[n-1];c.beginPath();c.arc(lp[0],lp[1],3.1,0,6.2832);c.fillStyle=cc;c.fill();
      c.strokeStyle=TH['--panel'];c.lineWidth=2;c.stroke();});
    if(HOV.t!=null){
      const ix=Math.round((HOV.t-times[base])/STEP);
      if(ix>=0&&ix<=n-1){
        const x=Math.round(X(ix))+.5;
        c.strokeStyle=hexA('--ink',.3);c.lineWidth=1;c.setLineDash([3,3]);
        c.beginPath();c.moveTo(x,PT);c.lineTo(x,PT+h);c.stroke();c.setLineDash([]);
        let accv=0,rows='<div class="t">'+hhs(times[base+ix])+'</div>';
        vis.forEach(s=>{const raw=s.d()[base+ix];let v=raw;if(cfg.stack){accv+=raw;v=accv;}
          c.beginPath();c.arc(x,Y(v),3.8,0,6.2832);c.fillStyle=col(s.tok);c.fill();
          c.strokeStyle=TH['--panel'];c.lineWidth=2;c.stroke();
          rows+='<div class="r"><em><i class="sw" style="'+swStyle(s.tok,s.dash)+'"></i>'+s.nm+'</em><b class="num">'+
            (Math.abs(raw)>=1000?grp(raw):fx(raw,dec))+(cfg.unit||'')+'</b></div>';});
        if(cfg.stack)rows+='<div class="r" style="border-top:1px solid '+TH['--border']+';margin-top:4px;padding-top:4px"><em>Tổng</em><b class="num">'+
          (accv>=1000?grp(accv):fx(accv,dec))+(cfg.unit||'')+'</b></div>';
        const an=ANN.filter(a=>Math.abs(a.t-times[base+ix])<STEP*1.5);
        if(an.length)rows+='<div class="r" style="margin-top:5px"><em style="color:'+col(sevCol[an[0].sev])+'">⚑ '+an[0].text+'</em></div>';
        if(HOV.src===host){tip.innerHTML=rows;tip.classList.add('on');
          const tw=tip.offsetWidth;let tx=x+14;if(tx+tw>W-4)tx=x-tw-14;
          tip.style.left=Math.max(4,tx)+'px';
          tip.style.top=Math.max(4,Math.min(H-tip.offsetHeight-4,HOV.y-12))+'px';}
        else tip.classList.remove('on');
      }else tip.classList.remove('on');
    }else tip.classList.remove('on');
    inst._geo={PL,PT,w,h,n,base};
  }
  host.addEventListener('mousemove',e=>{const r=host.getBoundingClientRect(),gg=inst._geo;if(!gg)return;
    const ix=Math.round((e.clientX-r.left-gg.PL)/gg.w*(gg.n-1));
    HOV=(ix<0||ix>gg.n-1)?{t:null,src:null,y:0}:{t:times[gg.base+ix],src:host,y:e.clientY-r.top};
    renderCross();});
  host.addEventListener('mouseleave',()=>{HOV={t:null,src:null,y:0};renderCross();});
  return inst;
}

function mkGauges(body,cfg){
  const A0=Math.PI*.75,A1=Math.PI*2.25;
  const arc=(r,a0,a1)=>{const p0=[60+r*Math.cos(a0),58+r*Math.sin(a0)],p1=[60+r*Math.cos(a1),58+r*Math.sin(a1)];
    return 'M'+fx(p0[0])+' '+fx(p0[1])+' A'+r+' '+r+' 0 '+((a1-a0)>Math.PI?1:0)+' 1 '+fx(p1[0])+' '+fx(p1[1]);};
  const wrap=document.createElement('div');wrap.className='gauges';
  if(cfg.cols)wrap.style.setProperty('--gc',cfg.cols);
  wrap.innerHTML=cfg.items.map((it,i)=>'<div class="g"><svg viewBox="0 0 120 96" role="img" aria-label="'+it.nm+'">'+
    '<path d="'+arc(40,A0,A1)+'" fill="none" stroke-width="9" stroke-linecap="round" class="trk"/>'+
    '<path class="val" data-i="'+i+'" fill="none" stroke-width="9" stroke-linecap="round"/>'+
    '<text class="gv" data-i="'+i+'" x="60" y="60" text-anchor="middle" font-family="Inter,sans-serif" font-size="19" font-weight="600">–</text>'+

      cfg.items.forEach((it,i)=>{const v=it.get(),f=Math.max(0,Math.min(1,(v-it.min)/(it.max-it.min)));

    data(){return{cols:['Chỉ số','Giá trị','Đơn vị'],rows:cfg.items.map(it=>[it.nm,fx(it.get(),it.dec),it.unit])};}};

function mkTable(body,cfg){
  const sc=document.createElement('div');sc.className='scroll';if(cfg.max)sc.style.maxHeight=cfg.max;
  const tb=document.createElement('table');tb.className='t'+(cfg.wide?' wide':'');
  tb.innerHTML='<thead><tr>'+(cfg.cols||[]).map((c,i)=>'<th'+(cfg.right&&cfg.right.includes(i)?' class="r"':'')+'>'+c+'</th>').join('')+'</tr></thead><tbody></tbody>';
  sc.append(tb);body.append(sc);const tbody=tb.querySelector('tbody');
  return {render(){tbody.innerHTML=cfg.rows().map(r=>'<tr>'+r.map((v,i)=>'<td'+(cfg.right&&cfg.right.includes(i)?' class="r num"':'')+'>'+v+'</td>').join('')+'</tr>').join('')
      ||'<tr><td colspan="'+(cfg.cols||[]).length+'"><div class="empty">Không có dữ liệu</div></td></tr>';},
    data(){return{cols:cfg.cols||[],rows:cfg.rows().map(r=>r.map(x=>String(x).replace(/<[^>]*>/g,'')))};}};
}

const RO=new ResizeObserver(es=>es.forEach(e=>{const p=PANELS.find(x=>x.body===e.target);if(p&&vis(p))safeRender(p);}));
function vis(p){return EXP?EXP===p:(p.tab===activeTab&&ROWOPEN[p.rowKey]!==false);}

function renderVisible(){readTheme();PANELS.forEach(p=>{if(vis(p))safeRender(p);});updFoot();}

function build(){
  const dash=document.getElementById('dash');let pid=0;
  TABS.forEach(tb=>{
    const sec=document.createElement('section');sec.dataset.tab=tb.id;sec.hidden=tb.id!==activeTab;
    (SPEC[tb.id]||[]).forEach((row,ri)=>{
      const key=tb.id+':'+ri;
      const hdr=document.createElement('button');hdr.className='rowhdr';hdr.setAttribute('aria-expanded','true');
      hdr.innerHTML='<span class="ar">▾</span><span>'+row.row+'</span><span class="meta">'+row.panels.length+' panel</span>';
      const g=document.createElement('div');g.className='grid';
      hdr.addEventListener('click',()=>{const open=hdr.getAttribute('aria-expanded')==='true';
        hdr.setAttribute('aria-expanded',String(!open));ROWOPEN[key]=!open;g.hidden=open;renderVisible();});
      row.panels.forEach(p=>{
        const el=document.createElement('section');el.className='panel';el.dataset.w=p.w;el.style.setProperty('--w',p.w);
        el.innerHTML='<header><h2>'+p.t+'</h2>'+(p.d?'<span class="info" title="'+p.d.replace(/"/g,'&quot;')+'">i</span>':'')+
          (p.s?'<span class="sub">'+p.s+'</span>':'')+
          '<details class="dd pmenu"><summary aria-label="Menu panel">⋮</summary><div class="menu">'+
          '<button data-a="view">⛶ Xem toàn màn hình<span class="kbd">v</span></button>'+
          '<button data-a="insp">▦ Inspect — data · query · JSON</button>'+
          '<button data-a="csv">⧉ Copy CSV</button></div></details></header><div class="body"></div>';
        const body=el.querySelector('.body');
        const inst=(KINDS[p.k]||mkTable)(body,p.c||{});
        const rec={el,body,inst,tab:tb.id,rowKey:key,title:p.t,spec:p,id:++pid,isTS:p.k==='ts'};
        PANELS.push(rec);RO.observe(body);
        el.querySelector('.pmenu .menu').addEventListener('click',e=>{
          const b=e.target.closest('button');if(!b)return;
          el.querySelector('.pmenu').open=false;
          if(b.dataset.a==='view')toggleExpand(rec);
          else if(b.dataset.a==='insp')openInspect(rec);
          else copyCSV(rec,b);});
        g.append(el);});
      sec.append(hdr,g);});
    dash.append(sec);});
  const tabs=document.getElementById('tabs');
  tabs.innerHTML=TABS.map(t=>'<button class="tab'+(t.id===activeTab?' on':'')+'" data-t="'+t.id+'">'+t.nm+
    ' <span class="cnt">'+(SPEC[t.id]||[]).reduce((s,r)=>s+r.panels.length,0)+'</span>'+
    (t.id==='ops'?'<span class="dotal" id="opsDot" hidden></span>':'')+'</button>').join('');
  tabs.addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;setTab(b.dataset.t);});
}
function setTab(id){activeTab=id;closeExpand();
  document.querySelectorAll('#tabs .tab').forEach(x=>x.classList.toggle('on',x.dataset.t===id));
  document.querySelectorAll('#dash section[data-tab]').forEach(s=>s.hidden=s.dataset.tab!==id);
  renderVisible();}

  const tm=document.getElementById('tmenu');

    renderVisible();});

function csvOf(rec){const d=rec.inst.data?rec.inst.data():{cols:[],rows:[]};

function copyCSV(rec,btn){const txt=csvOf(rec),old=btn.textContent;
  const done=ok=>{btn.textContent=ok?'✓ Đã copy':'✕ Không copy được';setTimeout(()=>btn.textContent=old,1600);};
  try{navigator.clipboard.writeText(txt).then(()=>done(true)).catch(()=>done(false));}catch(e){done(false);}}

  const dot=document.getElementById('liveDot');dot.style.background=ms?col('--ok'):col('--off');
  dot.style.animationPlayState=ms?'running':'paused';
  if(ms)timer=setInterval(tick,ms);}
function setRange(i){rangeIx=Math.max(0,Math.min(RANGES.length-1,i));
  document.getElementById('rangeLbl').textContent=RANGES[rangeIx].lbl;
  document.querySelectorAll('#menuRange button').forEach(b=>b.classList.toggle('sel',+b.dataset.i===rangeIx));
  renderVisible();}
function buildMenus(){
  const mr=document.getElementById('menuRange');
  mr.innerHTML='<div class="lbl">Khoảng thời gian</div>'+RANGES.map((r,i)=>'<button data-i="'+i+'"'+(i===rangeIx?' class="sel"':'')+'>'+r.lbl+'</button>').join('');
  mr.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    setRange(+b.dataset.i);document.getElementById('ddRange').open=false;});
  const mf=document.getElementById('menuRef');
  mf.innerHTML='<div class="lbl">Tự động làm mới</div>'+REFS.map((r,i)=>'<button data-i="'+i+'"'+(i===refIx?' class="sel"':'')+'>'+r.lbl+'</button>').join('');
  mf.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;refIx=+b.dataset.i;
    mf.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b));
    document.getElementById('ddRef').open=false;setRefresh();});
}
let themeMode='sys';
function applyTheme(){
  const r=document.documentElement;
  if(themeMode==='sys')r.removeAttribute('data-theme');else r.setAttribute('data-theme',themeMode);
  document.getElementById('themeLbl').textContent=themeMode==='sys'?'Hệ thống':themeMode==='dark'?'Tối':'Sáng';
  try{localStorage.setItem('netTheme',themeMode);}catch(e){}
  readTheme();setRefresh();renderVisible();}
document.getElementById('btnTheme').addEventListener('click',()=>{
  themeMode=themeMode==='sys'?'dark':themeMode==='dark'?'light':'sys';applyTheme();});
document.getElementById('btnKiosk').addEventListener('click',()=>{document.body.classList.toggle('kiosk');renderVisible();});
document.getElementById('btnZoom').addEventListener('click',()=>setRange(rangeIx+1));
document.getElementById('btnJson').addEventListener('click',()=>openModalHTML('Dashboard JSON model — '+UID,
  '<div class="qblock"><div class="qh">'+PANELS.length+' panel · '+TABS.length+' tab · schemaVersion 39</div><pre>'+esc(dashJSON())+'</pre></div>'));
document.getElementById('btnHelp').addEventListener('click',showHelp);
function showHelp(){openModalHTML('Phím tắt & cách dùng',
  '<div class="qblock"><div class="qh">Phím tắt</div><div class="keys">'+
  [['1 … 5','Chuyển tab dashboard'],['k','Bật/tắt kiosk mode'],['z','Zoom out khoảng thời gian'],
   ['r','Làm mới ngay một nhịp'],['t','Đổi sáng/tối'],['?','Mở bảng này'],['Esc','Đóng panel/modal/kiosk']]
  .map(r=>'<kbd>'+r[0]+'</kbd><span>'+r[1]+'</span>').join('')+'</div></div>'+
  '<div class="qblock"><div class="qh">Tương tác</div><pre>• Hover biểu đồ: crosshair đồng bộ trên mọi time series đang hiện\n'+
  '• Bấm legend: ẩn/hiện series\n• ⋮ trên panel: xem toàn màn hình, Inspect (data/query/JSON), copy CSV\n'+
  '• Bấm tiêu đề row: gập/mở cả hàng panel\n• $layer và $device lọc xuyên tất cả panel\n'+
  '• Bấm tiêu đề cột trong bảng thiết bị để sắp xếp</pre></div>'+
  '<div class="qblock"><div class="qh">Lưu ý</div><pre>Toàn bộ số liệu do trình duyệt sinh ra (seeded random walk + 9 alert rule).\n'+
  'Không có kết nối tới InfluxDB, Kafka hay thiết bị mạng thật; các câu query trong Inspect là query mẫu đúng cú pháp.</pre></div>');}
document.addEventListener('keydown',e=>{
  const t=e.target.tagName;if(t==='INPUT'||t==='TEXTAREA')return;
  if(e.key==='Escape'){if(modal)closeModal();else if(EXP)closeExpand();else document.body.classList.remove('kiosk');return;}
  if(e.key>='1'&&e.key<='5'){const tb=TABS[+e.key-1];if(tb)setTab(tb.id);return;}
  if(e.key==='k'){document.body.classList.toggle('kiosk');renderVisible();}
  else if(e.key==='z')setRange(rangeIx+1);
  else if(e.key==='r')tick();
  else if(e.key==='t'){themeMode=themeMode==='dark'?'light':'dark';applyTheme();}
  else if(e.key==='?')showHelp();
});
function updFoot(){
  const now=times[times.length-1],cr=[...ALERTS.values()].filter(a=>a.sev==='crit').length;
  const dot=document.getElementById('opsDot');if(dot)dot.hidden=!cr;
  document.getElementById('foot').innerHTML=
    '<span>uid <b>'+UID+'</b> · version <b>'+VER+'</b> · '+PANELS.length+' panel</span>'+
    '<span>data sources: <b>'+DS.tsdb+'</b>, '+DS.prom+', '+DS.logs+'</span>'+
    '<span>cập nhật lúc <b>'+hhs(now)+'</b> · Asia/Ho_Chi_Minh</span>'+
    '<span>Số liệu mô phỏng trong trình duyệt, không kết nối hệ thống thật.</span>';
}

/* ===================== 13. VÒNG LẶP ===================== */
let k=N;
function tick(){
  k++;subTick++;
  SENS.forEach(s=>s.step(k));
  times.push(times[times.length-1]+STEP);if(times.length>N)times.shift();
  const now=times[times.length-1];
  DEV.forEach(d=>{
    if(d.st!=='off'){
      if(rnd()<.07&&d.tcam>1)d.tcam--;
      d.seen=(d.seen+5)%12;
      const r=rnd();let s=d.st;
      if(s==='ok'&&r<.004)s='warn';else if(s==='warn'&&r<.08)s=(rnd()<.2?'crit':'ok');
      else if(s==='crit'&&r<.12)s='warn';
      if(d.tcam<12&&s==='ok')s='warn';
      d.st=s;
    }else{d.seen+=5;
      if(rnd()<.004){d.st='ok';d.seen=0;log('INFO','%LINK-3-UPDOWN: '+d.id+' trở lại trạng thái up · rtt='+fx(d.rtt,2)+'ms',now);}}
    d.states.push(d.st);if(d.states.length>361)d.states.shift();
    d.hist.push(devVal(d));if(d.hist.length>40)d.hist.shift();});
  ZONES.forEach((z,i)=>{HEAT[i][23]=HEAT[i][23]*.82+z.bwS.last()*.18;});
  ENH[23]=ENH[23]*.9+totKw()*.1;
  if(subTick%12===0){const l=G.wlat95.last(),tot=110+Math.round(rnd()*70);
    const shape=l>80?[.18,.22,.24,.2,.12,.04]:l>45?[.3,.3,.2,.13,.05,.02]:[.44,.3,.15,.07,.03,.01];
    LATH.shift();LATH.push(shape.map(p=>Math.round(tot*p*(.75+rnd()*.5))));}
  ANN=ANN.filter(a=>a.t>times[0]);
  evalAlerts(now);
  randomLog(now);if(rnd()<.55)randomLog(now);
  renderVisible();
}

/* ===================== 14. KHỞI ĐỘNG ===================== */
try{const t=localStorage.getItem('netTheme');if(t==='dark'||t==='light'||t==='sys')themeMode=t;}catch(e){}
readTheme();buildVars();buildMenus();build();
document.getElementById('rangeLbl').textContent=RANGES[rangeIx].lbl;
applyTheme();
window.addEventListener('resize',()=>renderVisible());
if(window.matchMedia)try{window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{readTheme();renderVisible();});}catch(e){}
</script>
